<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Directory</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 1rem;
      line-height: 1.6;
    }
    .repo-card {
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .repo-card h3 { margin: 0 0 8px 0; }
    .repo-card a { color: #0969da; text-decoration: none; }
    .repo-card a:hover { text-decoration: underline; }
    .repo-card p { margin: 0; color: #57606a; font-size: 0.95rem; }
  </style>
</head>
<body>

  <h1>My GitHub Pages Projects</h1>
  <div id="project-list">Loading projects...</div>

  <script>
    // Replace with your GitHub username
    const USERNAME = 'ionawest';

    async function fetchProjectPages() {
      const container = document.getElementById('project-list');
      
      try {
        // Fetch up to 100 repositories sorted by last updated
        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
        if (!res.ok) throw new Error('Failed to retrieve repositories');
        
        const repos = await res.json();

        // Filter for repos with Pages enabled, excluding the root profile site itself
        const activePages = repos.filter(repo => 
          repo.has_pages && 
          repo.name.toLowerCase() !== `${USERNAME.toLowerCase()}.github.io`
        );

        if (activePages.length === 0) {
          container.innerHTML = '<p>No active project pages found.</p>';
          return;
        }

        container.innerHTML = activePages.map(repo => `
          <div class="repo-card">
            <h3>
              <a href="https://${USERNAME}.github.io/${repo.name}/" target="_blank" rel="noopener">
                ${repo.name}
              </a>
            </h3>
            <p>${repo.description || 'No description provided.'}</p>
          </div>
        `).join('');

      } catch (error) {
        container.innerHTML = `<p>Error loading repositories: ${error.message}</p>`;
      }
    }

    fetchProjectPages();
  </script>
</body>
</html>
